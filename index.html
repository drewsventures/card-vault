<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
 --bg:#f4f1ea;--bg2:#fffdf8;--card:#ffffff;--card2:#f4f1e9;--elev:#efebe1;
 --ink:#201d16;--ink2:#4d473c;--mut:#8a8377;--faint:#aca596;--line:#e7e2d6;--line2:#dcd5c6;
 --gold:#a67c2e;--gold2:#c19542;--goldsoft:rgba(166,124,46,.10);
 --green:#1e9a54;--accent:#cf4436;--blue:#2f6ad6;--purple:#7a49c9;
 --chip:#f1ede4;--track:#e7e2d6;--nav:#fffdf8;
 --disp:'Fraunces',Georgia,serif;--ui:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
 color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1000px 460px at 90% -10%,rgba(166,124,46,.06),transparent 60%),radial-gradient(760px 380px at -8% 0%,rgba(47,106,214,.04),transparent 55%),var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;padding-bottom:74px;font-feature-settings:"tnum" 0}
.mono{font-family:var(--mono)}
.wrap{max-width:900px;margin:0 auto;padding:14px 15px 40px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);padding:12px 16px 11px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1}
header h1{font-family:var(--disp);font-weight:600;font-size:21px;margin:0;letter-spacing:-.01em;white-space:nowrap;flex:none}
.owner{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.owner b{color:var(--gold);font-weight:600}
header .as{font-size:11px;color:var(--faint);font-family:var(--mono)}
.hsearchwrap{margin-top:10px;position:relative}
.hsearchwrap input{width:100%;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px 11px 38px;font-size:15px;font-family:inherit;box-shadow:0 1px 2px rgba(60,50,25,.03)}
.hsearchwrap input::placeholder{color:var(--faint)}
.hsearchwrap input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--goldsoft)}
.hsearchwrap .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px;pointer-events:none}
.hide{display:none!important}
/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.015),transparent),var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi .n{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.01em}
.kpi .l{color:var(--mut);font-size:12px;margin-top:3px}
.kpi .d{font-size:11.5px;margin-top:5px;font-weight:600;font-family:var(--mono)}
h2{font-family:var(--disp);font-weight:600;font-size:16px;margin:24px 0 9px;letter-spacing:-.01em}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.014),transparent),var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 15px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.srow:last-child{border-bottom:none}
.srow .bar{flex:1;height:7px;background:var(--track);border-radius:5px;overflow:hidden;max-width:120px}
.srow .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:5px}
.srow .v{font-weight:600;min-width:64px;text-align:right;font-family:var(--mono);color:var(--gold)}
.srow .nm{flex:1;min-width:0}
.dupe{background:var(--goldsoft);border:1px solid var(--line2);border-radius:14px;padding:13px 15px;margin-top:12px;font-size:13px;color:var(--ink2)}
.dupe b{color:var(--gold)}
/* search */
.searchbar{position:sticky;top:54px;z-index:4;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);padding:8px 0 8px}
.searchbar input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:13px 15px;font-size:16px;font-family:inherit}
.searchbar input::placeholder{color:var(--faint)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 0 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:20px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-weight:600}
.chip.on{background:var(--goldsoft);color:var(--gold);border-color:rgba(201,168,102,.4)}
.count{color:var(--mut);font-size:12.5px;margin:10px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;transition:transform .14s,border-color .14s,box-shadow .14s}
.tile:active{transform:scale(.99)}
@media(hover:hover){.tile:hover{transform:translateY(-3px);border-color:rgba(166,124,46,.5);box-shadow:0 10px 26px rgba(60,50,25,.14)}}
.tile .ph{aspect-ratio:3/4.1;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile .ph .no{color:var(--faint);font-size:11px;text-align:center;padding:8px;font-family:var(--mono)}
.idchip{position:absolute;top:8px;left:8px;z-index:2;background:rgba(28,24,16,.78);backdrop-filter:blur(6px);color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;border-radius:7px;padding:3px 7px;border:1px solid rgba(255,255,255,.14);cursor:copy}
.idchip:active{background:var(--gold);color:#fff}
.tile .m{padding:9px 10px 11px}
.tile .pl{font-weight:600;font-size:12.5px;line-height:1.25}
.tile .st{color:var(--mut);font-size:11px;margin-top:2px;line-height:1.2}
.tile .pr{font-weight:600;margin-top:6px;font-size:15px;font-family:var(--disp);color:var(--gold)}
.tile .pr small{font-weight:600;font-size:9px;font-family:var(--mono)}
.vtag{display:inline-block;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.05em;padding:2px 5px;border-radius:5px;margin-left:5px;vertical-align:middle}
.vtag.est{background:rgba(224,178,90,.15);color:var(--gold2);border:1px solid rgba(224,178,90,.3)}
.vtag.comp{background:rgba(95,201,138,.15);color:var(--green);border:1px solid rgba(95,201,138,.3)}
.vtag.sold{background:var(--gold);color:#1a1305}
.vtag.rev{background:rgba(224,115,107,.15);color:var(--accent);border:1px solid rgba(224,115,107,.3)}
.badge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--gold);color:#1a1305;margin-left:5px;vertical-align:middle}
/* detail */
.sheet{position:fixed;inset:0;background:rgba(30,26,18,.42);backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetC{background:var(--bg2);width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 44px;border:1px solid var(--line2);border-bottom:none}
.sheetC .x{position:sticky;top:0;z-index:30;display:block;width:40px;height:40px;margin:-4px -4px 2px auto;font-size:24px;color:var(--ink2);background:var(--elev);border:1px solid var(--line2);border-radius:50%;text-align:center;line-height:38px;cursor:pointer}
.idbig{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.copyid{border:1px solid var(--line2);background:var(--card2);color:var(--gold);border-radius:7px;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;cursor:copy}
.copyid:active{background:var(--gold);color:#1a1305}
.dphotos{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 12px}
.dphotos img{width:100%;border-radius:12px;border:1px solid var(--line)}
.dphotos .no{aspect-ratio:3/4;background:var(--card);border:1px dashed var(--line2);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;font-family:var(--mono)}
.dval{font-family:var(--disp);font-size:28px;font-weight:600;letter-spacing:-.01em}
.dval small{font-size:12px;color:var(--mut);font-weight:500;font-family:var(--mono)}
.cvchart{margin:12px 0 4px}
.chartwrap{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.charthd{display:flex;justify-content:space-between;font-size:12px;margin:2px 0;font-family:var(--mono)}
.cvsvg{width:100%;height:64px;display:block;margin:4px 0}
.chartnote{background:var(--goldsoft);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;font-size:12px;color:var(--ink2)}
.mkt h3{font-size:13.5px;margin:16px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--disp);font-weight:600}
.mkt h3 small{color:var(--mut);font-weight:400;font-size:11px;text-align:right;font-family:var(--mono)}
.mitem{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mitem:last-child{border-bottom:none}
.mitem img{width:40px;height:40px;object-fit:cover;border-radius:7px;background:var(--track);flex:none}
.mitem .ni{width:40px;height:40px;flex:none;border-radius:7px;background:var(--track)}
.mitem .mt{flex:1;min-width:0;font-size:12px;line-height:1.3}
.mitem .mt a{color:var(--ink2);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mitem .mt .md{color:var(--faint);font-size:10.5px;margin-top:2px;font-family:var(--mono)}
.mitem .mp{font-weight:600;font-size:13px;white-space:nowrap;font-family:var(--mono);color:var(--gold)}
.mitem.unm{opacity:.45}
.mkt .more{color:var(--blue);font-size:12px;cursor:pointer;padding:9px 0 2px;font-weight:600}
.mkt .none{color:var(--mut);font-size:12px;padding:6px 0}
/* sell tools + pnl */
.pnlbox{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 2px}
.pnlc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.pnlc .l{color:var(--mut);font-size:11px}
.pnlc .n{font-family:var(--disp);font-size:17px;font-weight:600;margin-top:3px}
.rangebox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0}
.rangebox .rl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-family:var(--mono)}
.rangebox .rv{display:flex;justify-content:space-between;align-items:baseline;margin-top:3px}
.rangebox .rv b{font-family:var(--disp);font-size:21px;letter-spacing:-.01em}
.rangebox .rmid{font-size:12px;color:var(--mut);font-family:var(--mono)}
.selltools{margin:14px 0 4px}
.sellhd{font-family:var(--disp);font-size:15px;font-weight:600;margin:16px 0 9px}
.selltxt{margin-bottom:11px}
.sthd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:5px}
.sta{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:11px;padding:10px 12px;font:12.5px/1.5 var(--mono);resize:vertical;min-height:96px}
.cpbtn{border:1px solid var(--line2);background:var(--elev);color:var(--ink);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.cpbtn.ok{background:rgba(95,201,138,.16);color:var(--green);border-color:transparent}
.ebaybtn{width:100%;border:none;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1305;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
.ebaybtn.ok{background:linear-gradient(180deg,#7bd6a0,var(--green))}
.gear{background:none;border:none;color:var(--mut);font-size:18px;cursor:pointer;padding:2px 8px;line-height:1}
.revbadge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--accent);color:#fff;margin-left:5px;vertical-align:middle}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start}
.qcard img{width:46px;height:46px;object-fit:cover;border-radius:9px;background:var(--track);flex:none}
.qcard .qt{flex:1;min-width:0;font-size:12.5px;line-height:1.3}
.qcard .qt a{color:var(--blue);text-decoration:none;font-size:11px}
.qcard .qm{font-size:11px;color:var(--mut);margin-top:2px}
.qcard .qp{font-weight:600;white-space:nowrap;font-family:var(--mono);color:var(--gold)}
.stat-note{background:var(--goldsoft);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;font-size:12px;color:var(--ink2);margin:8px 0}
/* lots */
.lotrow{background:linear-gradient(180deg,rgba(255,255,255,.014),transparent),var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin-bottom:11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.lotrow .ln{font-family:var(--disp);font-weight:600;font-size:15.5px}
.lotrow .lm{color:var(--mut);font-size:12px;margin-top:3px}
.lotrow .lv{text-align:right;font-family:var(--disp);font-weight:600;white-space:nowrap;color:var(--gold)}
.lotrow .lv small{display:block;color:var(--mut);font-size:11px;font-weight:600;font-family:var(--mono)}
.newlot{width:100%;border:1px dashed var(--line2);background:var(--card);color:var(--gold);border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px}
.lottot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:10px 0}
.lottot .tc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.lottot .tc .n{font-family:var(--disp);font-size:17px;font-weight:600}
.lottot .tc .l{color:var(--mut);font-size:10.5px;margin-top:2px}
.lotact{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.lotact button{border:1px solid var(--line2);background:var(--elev);color:var(--ink);border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.lotact button.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1305;border-color:transparent}
.litem{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:8px}
.litem img{width:42px;height:42px;object-fit:cover;border-radius:9px;background:var(--track);flex:none}
.litem .lt{flex:1;min-width:0;font-size:12.5px;line-height:1.3;cursor:pointer}
.litem .lt .s{color:var(--mut);font-size:11px}
.litem .lp{font-weight:600;white-space:nowrap;font-size:13px;font-family:var(--mono);color:var(--gold)}
.litem .rm{border:none;background:none;color:var(--accent);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.buildbar{position:fixed;left:0;right:0;bottom:60px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1305;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:12;font-size:13px;font-weight:700}
.buildbar button{background:#1a1305;color:var(--gold);border:none;border-radius:9px;padding:7px 15px;font-weight:700;font-size:13px;cursor:pointer}
.tile.inlot{outline:2.5px solid var(--gold);outline-offset:-2.5px}
.tile .lotchk{position:absolute;top:6px;right:6px;z-index:2;background:var(--gold);color:#1a1305;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.addlotbtn{width:100%;border:1px solid var(--line2);background:var(--elev);color:var(--ink);border-radius:11px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;margin-top:9px}
.krow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:12px}
.krow .k{color:var(--mut)} .krow .val{text-align:right;font-weight:600;font-family:var(--mono)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--chip);border:1px solid var(--line2);color:var(--ink2)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--nav) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:62px;background:none;border:none;color:var(--faint);font-size:10.5px;padding:9px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav button.on{color:var(--gold)}
nav button .ic{font-size:17px;line-height:1}
.spin{text-align:center;color:var(--mut);padding:40px;font-size:14px}
.kpi[onclick]{cursor:pointer;transition:transform .05s} .kpi[onclick]:active{transform:scale(.985)}
.srow[onclick]{cursor:pointer}
.segbanner{display:inline-flex;align-items:center;background:var(--goldsoft);border:1px solid var(--line2);border-radius:20px;padding:5px 7px 5px 12px;margin-right:9px;font-size:12.5px;color:var(--ink);font-weight:600}
.segbanner b{color:var(--gold);cursor:pointer;margin-left:8px;font-weight:700}
.soldrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.soldrow .sthumb{width:44px;height:58px;border-radius:8px;overflow:hidden;background:var(--track);flex:none;display:flex;align-items:center;justify-content:center}
.soldrow .sthumb img{width:100%;height:100%;object-fit:cover}
.soldrow .sinfo{flex:1;min-width:0}
.soldrow .sinfo .pl{font-weight:600;font-size:13.5px;line-height:1.2}
.soldrow .sinfo .st{color:var(--mut);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soldrow .sinfo .sdec{font-size:11.5px;margin-top:4px;font-weight:600;font-family:var(--mono)}
.soldrow .sprice{text-align:right;font-family:var(--disp);font-weight:600;font-size:16px;flex:none;color:var(--gold)}
.soldrow .sprice .sub{color:var(--mut);font-size:10px;font-weight:500;font-family:var(--mono)}
.soldbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0}
.soldbox .sbrow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0}
.soldbox .sbrow span{color:var(--mut)}
.soldbox .sbrow b{font-family:var(--mono)}
.fld{margin:10px 0}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:10px 11px;color:var(--ink);font-size:15px;font-family:inherit}
.mrow{display:flex;gap:9px}.mrow .fld{flex:1;min-width:0}
.ferr{color:var(--accent);font-size:12px;margin:6px 0 0;min-height:14px}
.addpbtn{width:100%;background:var(--elev);border:1px solid var(--line2);color:var(--ink);border-radius:11px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin:9px 0 4px}
.listbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:9px 0}
.listlink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-decoration:none;padding:7px 12px;border-radius:10px;border:1px solid var(--line2)}
.listlink.live{color:var(--green);background:rgba(95,201,138,.12)}
.listlink.draft{color:var(--gold);background:var(--goldsoft)}
.listedit{font-size:12px;font-weight:600;color:var(--mut);background:none;border:1px dashed var(--line2);border-radius:10px;padding:7px 11px;cursor:pointer}
.listdot{color:var(--green);font-size:10px;margin-left:5px;vertical-align:middle}

function autoItem(t){return /\b(auto|autographed|autograph|signed|on[\s-]?card)\b/i.test(t);}
function bucketOf(t,c){const ci=cardGI(c),ii=itemGrade(t);let b;if(ci.g){if(!ii.g)b='raw';else if(ii.n&&ci.n&&ii.n===ci.n&&(!ii.gr||!ci.gr||ii.gr===ci.gr))b='same';else b='different';}else{b=ii.g?'different':'same';}if(b==='same'&&autoCard(c)!==autoItem(t))b='different';return b;}
function bmed(arr){const s=arr.map(x=>+x.price).filter(x=>x).sort((a,b)=>a-b);return s.length?(s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2):null;}
function mitem(r){
 const dt=r.item_date?new Date(r.item_date).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
 return `<div class="mitem">${r.image?`<img loading="lazy" src="${r.image}">`:'<div class="ni"></div>'}<div class="mt"><a href="${r.url||'#'}" target="_blank" rel="noopener">${r.title||''}</a><div class="md">${dt}</div></div><div class="mp">${money(r.price)}</div></div>`;
}
function renderMkt(c){
 const el=document.getElementById('cvmkt');if(!el)return;c=c||window.CUR||{};
 if(!MKT.sold.length&&!MKT.active.length){el.innerHTML='';return;}
 const ci=cardGI(c);
 const lbl={same:ci.g?('Same grade ('+(cleanGrade(c.grade)||'')+')'):'Raw — same as yours',different:ci.g?'Other grades':'Graded',raw:'Raw / ungraded'};
 const bh='font-size:11px;font-weight:700;color:var(--mut);margin:10px 0 3px;text-transform:uppercase;letter-spacing:.04em';
 function grp(arr,kind){
  const hd=kind==='sold'?'Recent sales':'Active listings';
  if(!arr.length)return `<div class="mkt"><h3><span>${hd}</span></h3><div class="none">None of this card found on the last pull.</div></div>`;
  const exp=MKT.exp[kind];const caps={same:exp?999:6,different:exp?999:3,raw:exp?999:3};
  let out=`<div class="mkt"><h3><span>${hd}</span><small>${arr.length} found</small></h3>`;
  for(const bk of ['same','different','raw']){const items=arr.filter(r=>r._bkt===bk);if(!items.length)continue;const m=bmed(items);
   out+=`<div style="${bh}">${lbl[bk]} &middot; ${items.length}${m!=null?' &middot; median '+money(m):''}</div>`;
   items.slice(0,caps[bk]).forEach(r=>out+=mitem(r));
   if(items.length>caps[bk])out+=`<div class="md" style="color:var(--mut);font-size:11px;margin:2px 0 4px">+${items.length-caps[bk]} more ${bk}</div>`;
  }
  if(arr.length>12)out+=`<div class="more" onclick="MKT.exp.${kind}=!MKT.exp.${kind};renderMkt(window.CUR)">${exp?'show less':'show all '+arr.length}</div>`;
  return out+'</div>';
 }
 el.innerHTML=grp(MKT.sold,'sold')+grp(MKT.active,'active');
}

function cmpRecent(arr){const w=arr.filter(r=>r.item_date&&r.price).slice().sort((a,b)=>(''+(b.item_date||'')).localeCompare(''+(a.item_date||'')));return w[0]||null;}

   <span style="font-size:11px;color:var(--mut);text-align:right">${ebA.length}</span></div>`;
 // assessed method note
 const vs=c.value_source||'';
 let method='';
 if(needsReviewSrc(vs)) method=`<span style="color:var(--accent);font-weight:700">Flagged for review (${srcLabel(c)})</span> — comps shown below, no auto-value set`;
 else if(/^(cardladder|sketch|owner|cost)/.test(vs)) method=`Assessed ${money(c.current_value)} · held (${srcLabel(c)}); comps below are the live cross-check`;
 else method=`Assessed ${money(c.current_value)} · recent-weighted (60% most-recent, 40% median) from ${srcLabel(c)}`;

 el.innerHTML=`<div class="chartwrap" style="margin:10px 0 4px">
   ${recentBanner}
   <div style="display:grid;${COLS};gap:6px;font-size:10px;letter-spacing:.05em;color:var(--mut);text-transform:uppercase;font-weight:700"><span>Source</span><span>Most recent</span><span>Median</span><span style="text-align:right">n</span></div>
   ${row('eBay sold',ebS,'#3b82c4')}${row('Card Ladder',clS,'#c9a866')}${aRange}

function renderSalesTrend(sold){
 const el=document.getElementById('cvtrend');if(!el)return;
 const pts=(sold||[]).filter(r=>r._bkt==='same'&&r.price&&r.item_date).map(r=>({d:r.item_date,t:new Date(r.item_date).getTime(),p:+r.price,s:r._src})).filter(r=>!isNaN(r.t)).sort((a,b)=>a.t-b.t);
 if(pts.length<2){el.innerHTML=pts.length?`<div class="chartnote">Latest matched sale ${money(pts[0].p)} on ${pts[0].d}. Trend chart fills in as more dated sales come in.</div>`:'';return;}
 const t0=pts[0].t,t1=pts[pts.length-1].t,tr=(t1-t0)||1;
 const ps=pts.map(x=>x.p),pmax=Math.max(...ps),pmin=Math.min(...ps),pr=(pmax-pmin)||1;
 const W=320,H=92,PX=6,PB=14,PT=6;
 const X=t=>PX+(t-t0)/tr*(W-2*PX), Y=p=>PT+(1-(p-pmin)/pr)*(H-PT-PB);
 let n=pts.length,sx=0,sy=0,sxy=0,sxx=0;
 pts.forEach(x=>{const xi=(x.t-t0)/tr;sx+=xi;sy+=x.p;sxy+=xi*x.p;sxx+=xi*xi;});
 const b=(n*sxy-sx*sy)/((n*sxx-sx*sx)||1),a=(sy-b*sx)/n;
 const up=b>=0,col=up?'var(--green)':'var(--accent)';
 const dots=pts.map(x=>`<circle cx="${X(x.t).toFixed(1)}" cy="${Y(x.p).toFixed(1)}" r="2.6" fill="${x.s==='cardladder'?'#c9a866':'#3b82c4'}" opacity="0.8"/>`).join('');
 const latest=pts[pts.length-1];
 el.innerHTML=`<div class="chartwrap"><div class="charthd">Sales trend <span style="color:${col};font-weight:700">${up?'&#9650;':'&#9660;'} ${pts.length} dated sales</span></div>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="cvsvg" style="height:92px"><line x1="${X(t0).toFixed(1)}" y1="${Y(a).toFixed(1)}" x2="${X(t1).toFixed(1)}" y2="${Y(a+b).toFixed(1)}" stroke="${col}" stroke-width="2"/>${dots}</svg>
  <div class="charthd" style="color:var(--mut)"><span>${pts[0].d} ${money(pts[0].p)}</span><span>latest ${latest.d} ${money(latest.p)}</span></div></div>`;
}
function pctile(sorted,p){if(!sorted.length)return null;const i=(sorted.length-1)*p;const lo=Math.floor(i),hi=Math.ceil(i);return sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);}
function soldStats(sold){
 const v=sold.filter(r=>r._bkt==='same'&&r.price).map(r=>+r.price).sort((a,b)=>a-b);
 if(!v.length)return null;
 return {n:v.length,low:Math.round(pctile(v,0.25)),med:Math.round(pctile(v,0.5)),high:Math.round(pctile(v,0.90))};
}

 const patch={op:'set_card',card_id:id};
 const setText=(k,v)=>{const cur=(c[k]==null?'':String(c[k]));if(v!==cur)patch[k]=v;};
 setText('player',gv('e_player'));setText('set_name',gv('e_set'));setText('year',gv('e_year'));
 setText('card_number',gv('e_num'));setText('variation',gv('e_var'));

 if(dom!==curDom)patch.tax_domain=dom;
 if(dom==='sports'){if(type!==curLeague)patch.tax_league=type;if(curCat!=='')patch.tax_category='';}
 else if(dom==='culture'){if(type!==curCat)patch.tax_category=type;if(curLeague!=='')patch.tax_league='';}
 else{if(curLeague!=='')patch.tax_league='';if(curCat!=='')patch.tax_category='';}
 const cost=gv('e_cost'),curCost=(c.cost_basis==null?'':String(c.cost_basis));if(cost!==curCost)patch.cost_basis=cost;

 if(val!==curVal){patch.current_value=val;patch.value_source='owner-estimate';patch.value_date=new Date().toISOString().slice(0,10);}
 if(cb('e_rook')!==!!c.is_rookie)patch.is_rookie=cb('e_rook');

 go.disabled=true;go.textContent='Saving…';

}

function evStats(d){
 let spent=0,proceeds=0,realized=0,realN=0;
 d.buys.forEach(c=>{spent+=(+c.cost_basis||0);});
 d.sells.forEach(c=>{proceeds+=(+c.sale_price||0);const rl=realizedPL(c);if(rl!=null){realized+=rl;realN++;}});
 return {spent,proceeds,net:proceeds-spent,realized,realN};
}
function renderShows(){

 if(!names.length){h+=`<div class="spin">No shows tagged yet.</div>`;el.innerHTML=h;return;}
 h+=`<div class="panel" style="margin-top:10px;padding:2px 12px">`;

async function lotOp(payload){
 const r=await fetch(FN_LOT,{method:'POST',headers:{'content-type':'application/json','x-ingest-secret':LOT_SECRET,apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(payload)});
 return await r.json();
}
async function loadLots(){
 try{
  LOTS=await fetchJSON(SB+"/rest/v1/lots?select=id,name,status,notes,suggested_price,created_at&order=created_at.desc",2)||[];
  const items=await fetchJSON(SB+"/rest/v1/lot_items?select=lot_id,card_id&limit=5000",2)||[];
  LOTMEM={}; LOTS.forEach(l=>LOTMEM[l.id]=new Set());
  items.forEach(it=>{(LOTMEM[it.lot_id]=LOTMEM[it.lot_id]||new Set()).add(it.card_id);});
 }catch(e){LOTS=[];LOTMEM={};}
}
function lotTotals(id){
 const set=LOTMEM[id]||new Set(); let val=0,cost=0,n=0;
 CARDS.forEach(c=>{if(set.has(c.id)){n++;val+=(+c.current_value||0);cost+=(+c.cost_basis||0);}});
 return {n,val,cost};
}
async function renderLots(){
 const el=document.getElementById('lots');
 el.innerHTML='<h2 style="margin:16px 0 8px">Lots</h2><div class="spin">Loading…</div>';
 await loadLots();
 let h='<h2 style="margin:16px 0 8px">Lots</h2>';
 h+='<button class="newlot" onclick="newLot()">+ New lot</button>';
 if(!LOTS.length) h+='<div class="stat-note">No lots yet. Make one, then add cards from Search or a card’s page.</div>';
 LOTS.forEach(l=>{const t=lotTotals(l.id);
   h+=`<div class="lotrow" onclick="openLot('${l.id}')"><div><div class="ln">${l.name||'Untitled lot'}</div><div class="lm">${t.n} card${t.n===1?'':'s'}${l.status?' &middot; '+l.status:''}</div></div><div class="lv">${money(t.val)}<small>${t.cost?('cost '+money(t.cost)):'value'}</small></div></div>`;
 });
 el.innerHTML=h;
}
async function newLot(){
 const name=prompt('Name this lot (e.g. "Show 9/6")');
 if(name===null)return;
 const res=await lotOp({op:'create_lot',name:name||'New lot'});
 if(res&&res.ok){await loadLots();renderLots();openLot(res.id);}
 else alert('Could not create lot');
}
function openLot(id){
 OPENLOT=id; const l=LOTS.find(x=>x.id===id); if(!l){renderLots();return;}
 const set=LOTMEM[id]||new Set();
 const cards=CARDS.filter(c=>set.has(c.id)).sort((a,b)=>(b.current_value||0)-(a.current_value||0));
 const t=lotTotals(id); const pnl=t.cost?t.val-t.cost:null;
 const el=document.getElementById('lots');
 let h=`<div style="display:flex;align-items:center;gap:8px;margin:16px 0 4px"><button class="cpbtn" onclick="show('lots');renderLots()">&lsaquo; Lots</button><h2 style="margin:0;flex:1">${l.name||'Lot'}</h2></div>`;
 h+=`<div class="lottot"><div class="tc"><div class="n">${t.n}</div><div class="l">cards</div></div><div class="tc"><div class="n">${money(t.val)}</div><div class="l">value</div></div><div class="tc"><div class="n" style="color:${pnl==null?'var(--ink)':(pnl>=0?'var(--green)':'var(--accent)')}">${t.cost?money(t.cost):'--'}</div><div class="l">cost</div></div></div>`;
 h+=`<div class="lotact"><button class="primary" onclick="startBuild('${id}')">+ Add cards</button><button onclick="copyLotPost('${id}')">Copy lot post</button><button onclick="renameLot('${id}')">Rename</button><button onclick="deleteLot('${id}')">Delete</button></div>`;
 if(!cards.length) h+='<div class="stat-note">No cards yet. Tap “+ Add cards” and tap cards to add them.</div>';
 cards.forEach(c=>{const u=primary(c);
   h+=`<div class="litem"><img loading="lazy" src="${u||''}" onerror="this.style.visibility='hidden'"><div class="lt" onclick='openCard("${c.id}")'>${c.player||c.ref}<div class="s">${c.set_name||''} ${c.card_number?'#'+c.card_number:''} &middot; <span style="color:${srcColor(c)}">${money(c.current_value)}</span></div></div><button class="rm" title="remove" onclick="removeFromLot('${id}','${c.id}')">&times;</button></div>`;
 });
 el.innerHTML=h; window.scrollTo(0,0);
}
async function renameLot(id){const l=LOTS.find(x=>x.id===id);const name=prompt('Rename lot',l?l.name:'');if(name===null)return;await lotOp({op:'rename_lot',lot_id:id,name});await loadLots();openLot(id);}
async function deleteLot(id){if(!confirm('Delete this lot? (cards stay in your inventory)'))return;await lotOp({op:'delete_lot',lot_id:id});await loadLots();show('lots');renderLots();}
async function removeFromLot(lotId,cardId){(LOTMEM[lotId]||new Set()).delete(cardId);await lotOp({op:'remove_item',lot_id:lotId,card_id:cardId});openLot(lotId);}
async function addToLotId(lotId,cardId){(LOTMEM[lotId]=LOTMEM[lotId]||new Set()).add(cardId);await lotOp({op:'add_item',lot_id:lotId,card_id:cardId});}
/* builder mode: browse Search, tap toggles membership */
function startBuild(id){BUILDLOT=id;show('search');navSearchKeep();updateBuildBar();}
function navSearchKeep(){VALONLY=false;SEGFILTER=null;FILT='all';setChip('all');show('search');runSearch();}
function updateBuildBar(){
 const bar=document.getElementById('buildbar');
 if(!BUILDLOT){bar.classList.add('hide');return;}
 const l=LOTS.find(x=>x.id===BUILDLOT);const t=lotTotals(BUILDLOT);
 bar.className='buildbar';
 bar.innerHTML=`<span>Adding to “${l?l.name:'lot'}” &middot; ${t.n} card${t.n===1?'':'s'} &middot; ${money(t.val)}</span><button onclick="finishBuild()">Done</button>`;
}
function finishBuild(){const id=BUILDLOT;BUILDLOT=null;document.getElementById('buildbar').classList.add('hide');show('lots');if(id)openLot(id);else renderLots();}
async function toggleLotCard(cardId){
 if(!BUILDLOT)return;
 const set=LOTMEM[BUILDLOT]=LOTMEM[BUILDLOT]||new Set();
 if(set.has(cardId)){set.delete(cardId);await lotOp({op:'remove_item',lot_id:BUILDLOT,card_id:cardId});}
 else{set.add(cardId);await lotOp({op:'add_item',lot_id:BUILDLOT,card_id:cardId});}
 runSearch();updateBuildBar();
}
async function addToLotMenu(cardId){
 if(!LOTS.length) await loadLots();
 const box=document.getElementById('settings');
 const rows=LOTS.map(l=>{const inl=(LOTMEM[l.id]||new Set()).has(cardId);return `<div class="lotrow" onclick="toggleCardInLot('${l.id}','${cardId}',this)"><div><div class="ln">${l.name||'Lot'}</div><div class="lm">${lotTotals(l.id).n} cards</div></div><div class="lv" style="color:${inl?'var(--green)':'var(--mut)'}">${inl?'&#10003; in lot':'add'}</div></div>`;}).join('');
 box.innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSettings()"><div class="sheetC" style="max-width:480px">
   <span class="x" onclick="closeSettings()">&times;</span>
   <h2 style="margin:2px 0 10px;font-size:18px">Add to a lot</h2>
   ${rows||'<div class="stat-note">No lots yet.</div>'}
   <button class="newlot" style="margin-top:10px" onclick="newLotFor('${cardId}')">+ New lot</button>
 </div></div>`;
}
async function toggleCardInLot(lotId,cardId,elrow){
 const inl=(LOTMEM[lotId]||new Set()).has(cardId);
 if(inl){await removeFromLotSilent(lotId,cardId);}else{await addToLotId(lotId,cardId);}
 addToLotMenu(cardId);
}
async function removeFromLotSilent(lotId,cardId){(LOTMEM[lotId]||new Set()).delete(cardId);await lotOp({op:'remove_item',lot_id:lotId,card_id:cardId});}
async function newLotFor(cardId){const name=prompt('Name this lot (e.g. "Show 9/6")');if(name===null)return;const res=await lotOp({op:'create_lot',name:name||'New lot'});if(res&&res.ok){await loadLots();await addToLotId(res.id,cardId);addToLotMenu(cardId);}}
function copyLotPost(id){
 const l=LOTS.find(x=>x.id===id);const set=LOTMEM[id]||new Set();
 const cards=CARDS.filter(c=>set.has(c.id)).sort((a,b)=>(b.current_value||0)-(a.current_value||0));
 const t=lotTotals(id);const tm=terms();
 let L=[(l&&l.name?l.name:'Card lot')+' — '+cards.length+' cards'];
 L.push('');
 cards.forEach((c,i)=>{L.push((i+1)+'. '+cardLine(c)+(c.current_value?(' — $'+Math.round(c.current_value)):''));});
 L.push('');
 L.push('Value if bought separately: ~$'+Math.round(t.val).toLocaleString());
 L.push('Bundle price: $'+(l&&l.suggested_price?l.suggested_price:'[your price]'));
 L.push('');
 if(tm.pay)L.push(tm.pay); if(tm.ship)L.push(tm.ship); if(tm.claim)L.push(tm.claim);
 if(tm.closer)L.push('','— '+tm.closer);
 const txt=L.join('\n');
 const done=()=>alert('Lot post copied to clipboard');
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,done);else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done();}
}

document.getElementById('q').addEventListener('input',runSearch);

/* ================= SKETCH REVIEW ================= */
const FN_SK=SB+"/functions/v1/sketch-ops";
let SKQ=null, SKI=0, SKFILTER='todo', SKMODE=false, SKEDIT=false, SKCOMPS={};
const SKTIER={T1:['Same artist + same character','var(--green)'],T2:['Same artist + character, other version','var(--green)'],T3:['Same artist, other character','var(--blue)'],T4:['Same character, other artist','var(--blue)'],T5:['Similar sketch (same set)','var(--mut)'],S:['Same subject + same set','var(--green)'],SA:['Same artist + same set','var(--green)'],S2:['Same subject, other set','var(--blue)'],F:['Same set, other subject','var(--mut)']};
const SKCONF={high:'Strong: several close matches sold recently (same artist + character, or same subject + set)',medium:'Good: some close matches',low:'Thin: few close matches, lean on your judgment',none:'No close match: priced off similar sketches'};
async function skOp(p){
 const r=await fetch(FN_SK,{method:'POST',headers:{'content-type':'application/json','x-ingest-secret':LOT_SECRET,apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(p)});
 return r.json();
}
function skParseNotes(n){
 n=n||''; const i=n.indexOf('Sep 22 photo review:'); if(i<0) return {flag:null,note:null};
 const seg=n.slice(i+20).split(' || ')[0]; const parts=seg.split(' | ').map(s=>s.trim()).filter(Boolean);
 let flag=null, note=[];
 parts.forEach(p=>{ if(/WRONG|NOT A SKETCH|MIX-UP/.test(p)) flag=p; else note.push(p); });
 return {flag, note: note.join(' ')||null};
}
async function loadSketchQueue(force){
 if(SKQ&&!force) return;
 const [vals,revs,meta]=await Promise.all([
  fetchJSON(SB+'/rest/v1/sketch_valuations?select=id,card_id,run_at,model_version,model_value,low,high,confidence,pools,explanation,comp_ids,recent_price,recent_date,prior_value&order=run_at.desc&limit=3000',2),
  fetchJSON(SB+'/rest/v1/value_reviews?select=card_id,action,final_value,model_value,note,reviewed_at&order=reviewed_at.desc&limit=5000',2),
  fetchJSON(SB+'/rest/v1/sketch_cards?select=card_id,character_raw,artist_raw,artist_confidence,product,product_year,parallel,format,is_artist_proof,quality_band,is_graded,grade,id_status,notes,subject_category,franchise&limit=3000',2)]);
 const V={},R={},M={};
 (vals||[]).forEach(v=>{if(!V[v.card_id])V[v.card_id]=v;});
 (revs||[]).forEach(r=>{if(!(r.card_id in R))R[r.card_id]=(r.action==='reset'?null:r);});
 (meta||[]).forEach(m=>M[m.card_id]=m);
 const own=CARDS.filter(c=>M[c.id]&&c.status!=='sold'&&c.status!=='duplicate');
 own.forEach(c=>{c._sk=M[c.id]; c._skv=V[c.id]||null; c._skr=R[c.id]||null; const p=skParseNotes(c._sk.notes); c._flag=p.flag; c._fnote=p.note; c._nophoto=!(c.photos&&c.photos.length);});
 SKQ=own.sort((a,b)=>((b._flag?2:0)+(b._nophoto?0:1))-((a._flag?2:0)+(a._nophoto?0:1)) || (+b.current_value||0)-(+a.current_value||0));
}
function skAttention(c){return !!(c._flag||c._nophoto||!c._skv||['low','none'].includes(c._skv.confidence));}
function skList(){
 if(!SKQ) return [];
 if(SKFILTER==='all') return SKQ;
 if(SKFILTER==='done') return SKQ.filter(c=>c._skr);
 if(SKFILTER==='attention') return SKQ.filter(c=>!c._skr&&skAttention(c));
 return SKQ.filter(c=>!c._skr);
}
async function openSketchReview(cardId){
 SKMODE=true; SKEDIT=false; show('review');
 const el=document.getElementById('review'); el.innerHTML='<div class="spin">Loading sketches…</div>';
 try{ await loadSketchQueue(); }catch(e){ el.innerHTML='<div class="spin">Could not load sketch data ('+e.message+').</div>'; return; }
 if(cardId){ let L=skList(); let i=L.findIndex(c=>c.id===cardId); if(i<0){SKFILTER='all'; L=skList(); i=L.findIndex(c=>c.id===cardId);} SKI=Math.max(0,i); }
 renderSketchReview();
}
function closeSketchReview(){ SKMODE=false; SKEDIT=false; renderReview(); }
function skSetFilter(f){ SKFILTER=f; SKI=0; SKEDIT=false; renderSketchReview(); }
function skMove(d){ const L=skList(); SKI=Math.min(Math.max(0,SKI+d),Math.max(0,L.length-1)); SKEDIT=false; renderSketchReview(); window.scrollTo(0,0); }
function skFmtDate(d){ if(!d) return ''; try{ return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}catch(e){return d;} }
function renderSketchReview(){
 const el=document.getElementById('review'); const L=skList();
 if(SKI>=L.length) SKI=Math.max(0,L.length-1);
 const tot=SKQ.length, done=SKQ.filter(c=>c._skr).length;
 const cnt={todo:SKQ.filter(c=>!c._skr).length, attention:SKQ.filter(c=>!c._skr&&skAttention(c)).length, done, all:tot};
 const chip=(k,l)=>`<span class="chip ${SKFILTER===k?'on':''}" onclick="skSetFilter('${k}')">${l} (${cnt[k]})</span>`;
 let h=`<div class="skhd"><button class="bk" onclick="closeSketchReview()">&larr; Review</button><span class="pg">${done} of ${tot} reviewed</span></div>
  <div class="skbar"><i style="width:${tot?Math.round(100*done/tot):0}%"></i></div>
  <div class="chips">${chip('todo','To review')}${chip('attention','Needs a look')}${chip('done','Reviewed')}${chip('all','All')}</div>`;
 if(!L.length){ el.innerHTML=h+`<div class="skcard"><div class="spin">Nothing left in this view. ${SKFILTER!=='all'?'Switch to <b>All</b> to revisit any card.':''}</div></div>`; return; }
 const c=L[SKI], v=c._skv, m=c._sk||{};
 const front=(c.photos||[]).find(p=>p.side==='front')||(c.photos||[])[0], back=(c.photos||[]).find(p=>p.side==='back');
 const proposed=v?+v.model_value:(+c.current_value||0);
 const conf=v?v.confidence:null;
 const facts=[];
 if(m.character_raw) facts.push(esc(m.character_raw));
 facts.push(m.artist_raw&&!/illegible|tbd|unreadable|scrawl/i.test(m.artist_raw)?('by '+esc(m.artist_raw)+(m.artist_confidence&&m.artist_confidence!=='confirmed'?` <span class="q">(${esc(m.artist_confidence)})</span>`:'')):'artist not identified');
 if(m.product&&m.product!=='unknown') facts.push(esc(m.product)+(m.product_year?' '+m.product_year:''));
 if(m.parallel&&m.parallel!=='base') facts.push(esc(m.parallel.replace('_',' ')));
 if(m.format&&m.format!=='standard') facts.push(esc(m.format.replace('_',' ')));
 if(m.is_artist_proof) facts.push('Artist proof');
 if(m.grade) facts.push('Graded '+esc(m.grade));
 const rt=v&&v.pools&&v.pools.recent_tier; const rtl=rt&&SKTIER[rt]?SKTIER[rt][0]:'';
 h+=`<div class="skcard">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-family:var(--mono);font-size:12px;color:var(--gold)">${esc(c.ref)}</span><span class="pg" style="font-family:var(--mono);font-size:11px;color:var(--mut)">${SKI+1} / ${L.length}</span></div>
  <div style="font-family:var(--disp);font-weight:600;font-size:19px;margin:3px 0 0;line-height:1.2">${esc(c.player||m.character_raw||c.ref)}</div>
  <div class="skfacts">${facts.map(f=>`<span>${f}</span>`).join('')}</div>
  ${c._flag?`<div class="skflag"><b>Check this:</b> ${esc(c._flag)}</div>`:''}
  ${c._nophoto?`<div class="skflag"><b>No photos yet.</b> The value is based on the character only. Photograph the front and back so the artist can be read.</div>`:''}
  ${c._fnote?`<div class="sknote">${esc(c._fnote)}</div>`:''}
  <div class="skph">${front?`<a href="${front.url}" target="_blank" rel="noopener"><img src="${front.url}" alt="front"></a>`:'<div class="no">no front photo</div>'}${back?`<a href="${back.url}" target="_blank" rel="noopener"><img src="${back.url}" alt="back"></a>`:'<div class="no">no back photo</div>'}</div>
  <div class="skval"><div><div class="lab">${c._skr?'CURRENT VALUE':'PROPOSED VALUE'}</div><div class="big">${money(c._skr?c.current_value:proposed)}</div></div>
   <div style="text-align:right">${conf?`<span class="skpill ${conf}">${conf} confidence</span><div style="font-size:11px;color:var(--mut);margin-top:4px;max-width:210px">${SKCONF[conf]||''}</div>`:'<span class="skpill none">no model value</span>'}</div></div>
  <div class="skgrid">
   <div><div class="l">Most recent close sale</div><div class="n">${v&&v.recent_price!=null?money(v.recent_price):'--'}</div><div class="d">${v&&v.recent_date?skFmtDate(v.recent_date):''}${rtl?'<br>'+rtl:''}</div></div>
   <div><div class="l">Likely range</div><div class="n">${v&&v.low!=null?money(v.low)+'–'+money(v.high):'--'}</div><div class="d">middle half of comps</div></div>
   <div><div class="l">Before this pass</div><div class="n">${v&&v.prior_value!=null?money(v.prior_value):'--'}</div><div class="d">old estimate</div></div>
  </div>`;
 if(c._skr){
  const r=c._skr; const lbl=r.action==='override'?'You set your own estimate':'You confirmed';
  h+=`<div class="skdone"><span>&#10003; ${lbl}: <b>${money(r.final_value)}</b>${r.note?' &middot; '+esc(r.note):''}</span><button onclick="skUndo('${c.id}')">Undo</button></div>`;
 }
 if(SKEDIT){
  h+=`<div class="skedit"><input id="skin" type="number" inputmode="decimal" min="0" step="1" value="${Math.round(c._skr?+c.current_value:proposed)}" onkeydown="if(event.key==='Enter'){event.preventDefault();skSave('${c.id}')}">
   <button onclick="skSave('${c.id}')">Save my value</button><button style="background:none;color:var(--mut);border:1px solid var(--line2)" onclick="SKEDIT=false;renderSketchReview()">Cancel</button>
   <textarea id="sknote" placeholder="Optional note (why, or a correction, e.g. artist is actually …)"></textarea></div>
   <div style="font-size:11.5px;color:var(--mut)">Saved as <b>Owner estimate</b>. The model's number and comps stay on file for reference.</div>`;
 } else {
  h+=`<div class="skbtns"><button class="ok" onclick="skConfirm('${c.id}')">&#10003; Confirm ${money(proposed)}</button><button onclick="SKEDIT=true;renderSketchReview();setTimeout(()=>{const i=document.getElementById('skin');if(i){i.focus();i.select();}},30)">Change value</button></div>`;
 }
 h+=`<div class="sknav"><button onclick="skMove(-1)">&larr; Previous</button><button onclick="skMove(1)">Skip &rarr;</button></div>
  <div class="skcomps" id="skcomps"><h3>Comparable sales <small>loading…</small></h3></div>
  <div class="skhow">${v?esc(v.explanation||''):''}${v?'<br>':''}Keyboard: Enter confirms, E changes the value, arrow keys move.</div>
 </div>`;
 el.innerHTML=h;
 skLoadComps(c);
}
async function skLoadComps(c){
 const box=document.getElementById('skcomps'); if(!box) return;
 const v=c._skv; const ids=(v&&v.comp_ids)||[];
 if(!ids.length){ box.innerHTML='<h3>Comparable sales</h3><div class="none" style="color:var(--mut);font-size:12px;padding:6px 0">No comps saved for this card yet.</div>'; return; }
 try{
  if(!SKCOMPS[c.id]) SKCOMPS[c.id]=await fetchJSON(SB+'/rest/v1/sketch_comps?select=id,title,sold_price,sold_date,url,image_url,source&id=in.('+ids.join(',')+')',2);
 }catch(e){ box.innerHTML='<h3>Comparable sales</h3><div style="color:var(--mut);font-size:12px">Could not load comps.</div>'; return; }
 if(!SKMODE||!document.getElementById('skcomps')) return;
 const byId={}; (SKCOMPS[c.id]||[]).forEach(x=>byId[x.id]=x);
 const tiers=(v.pools&&v.pools.comp_tiers)||{};
 const rows=ids.map(id=>byId[id]).filter(Boolean);
 box.innerHTML=`<h3>Comparable sales <small>${rows.length} shown &middot; best match first</small></h3>`+rows.map(x=>{
  const t=tiers[x.id]||[]; const tl=SKTIER[t[0]]||['','var(--mut)']; const adj=t[1];
  const p=+x.sold_price; const showAdj=adj!=null&&Math.abs(adj-p)/Math.max(p,1)>0.1;
  const own=x.source==='own_sale';
  return `<div class="skc">${x.image_url?`<img loading="lazy" src="${x.image_url}">`:'<div style="width:52px;height:68px;border-radius:7px;background:var(--track);flex:none"></div>'}
   <div class="ct">${x.url?`<a href="${x.url}" target="_blank" rel="noopener">${esc(x.title||'')}</a>`:esc(x.title||'')}<div class="tl" style="color:${tl[1]}">${own?'Your own sale &middot; ':''}${tl[0]}</div></div>
   <div class="cp"><b>${money(p)}</b><div>${skFmtDate(String(x.sold_date||'').slice(0,10))}</div>${showAdj?`<div title="Adjusted for differences in set, parallel, artist or character">≈ ${money(adj)} for yours</div>`:''}</div></div>`;
 }).join('');
}
function skAfter(c){
 // stay on same index in 'todo'/'attention' views (card drops out); advance in others
 SKEDIT=false;
 if(SKFILTER==='done'||SKFILTER==='all') SKI++;
 renderSketchReview(); window.scrollTo(0,0);
}
async function skConfirm(id){
 const c=CARDS.find(x=>x.id===id); if(!c) return;
 const val=c._skv?+c._skv.model_value:+c.current_value;
 const b=document.querySelector('.skbtns .ok'); if(b){b.disabled=true;b.textContent='Saving…';}
 try{
  const r=await skOp({op:'review_confirm',card_id:id,value:val});
  if(!r.ok) throw new Error(r.error||'failed');
  c.current_value=r.final_value; c.value_source=r.value_source; c.needs_review=false;
  c._skr={action:'confirm',final_value:r.final_value,reviewed_at:new Date().toISOString()};
  skAfter(c);
 }catch(e){ if(b){b.disabled=false;b.textContent='Retry confirm';} alert('Could not save: '+e.message); }
}
async function skSave(id){
 const c=CARDS.find(x=>x.id===id); if(!c) return;
 const inp=document.getElementById('skin'); const val=parseFloat(inp&&inp.value);
 if(!(val>=0)){ if(inp) inp.focus(); return; }
 const note=(document.getElementById('sknote')||{}).value||'';
 try{
  const r=await skOp({op:'review_override',card_id:id,value:val,note:note.trim()||null});
  if(!r.ok) throw new Error(r.error||'failed');
  c.current_value=r.final_value; c.value_source=r.value_source; c.needs_review=false;
  c._skr={action:'override',final_value:r.final_value,note:note.trim()||null,reviewed_at:new Date().toISOString()};
  skAfter(c);
 }catch(e){ alert('Could not save: '+e.message); }
}
async function skUndo(id){
 const c=CARDS.find(x=>x.id===id); if(!c) return;
 try{
  const r=await skOp({op:'review_reset',card_id:id});
  if(!r.ok) throw new Error(r.error||'failed');
  c.current_value=r.final_value; c.value_source=r.value_source; c.needs_review=true; c._skr=null;
  renderSketchReview();
 }catch(e){ alert('Could not undo: '+e.message); }
}
document.addEventListener('keydown',function(e){
 if(!SKMODE) return; const tg=(e.target&&e.target.tagName)||''; if(/INPUT|TEXTAREA|SELECT/.test(tg)) return;
 if(document.getElementById('sheet').innerHTML) return;
 const L=skList(); const c=L[SKI]; if(!c) return;
 if(e.key==='Enter'&&!SKEDIT&&!c._skr){e.preventDefault();skConfirm(c.id);}
 else if(e.key==='e'||e.key==='E'){e.preventDefault();SKEDIT=true;renderSketchReview();setTimeout(()=>{const i=document.getElementById('skin');if(i){i.focus();i.select();}},30);}
 else if(e.key==='ArrowRight'){e.preventDefault();skMove(1);}
 else if(e.key==='ArrowLeft'){e.preventDefault();skMove(-1);}
 else if(e.key==='Escape'&&SKEDIT){SKEDIT=false;renderSketchReview();}
});
function sketchEntryHTML(){
 const sk=CARDS.filter(c=>c.status!=='sold'&&c.status!=='duplicate'&&/^(sketch-model|sketch-confirmed|owner-estimate)$/.test(c.value_source||''));
 const todo=sk.filter(c=>c.needs_review).length;
 return `<div class="skentry" onclick="openSketchReview()"><div><div class="t">Sketch values</div><div class="s">${todo?todo+' to confirm or adjust':'All reviewed'} &middot; photos, comps and one-tap confirm</div></div><button>${todo?'Start':'Open'}</button></div>`;
}
