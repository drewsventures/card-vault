<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Vault</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#181b20;--mut:#6b7280;--line:#e4e7ec;--accent:#c8102e;--green:#0a7d33;--blue:#3b6fd4;--gold:#b8860b;--chip:#eef2ff;--track:#e9ecf1;--nav:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8eaed;--mut:#9aa3af;--line:#2a2f37;--chip:#1e2430;--track:#252b34;--nav:#12161c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:70px}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;letter-spacing:-.3px}
header .as{font-size:11px;color:var(--mut)}
.hide{display:none!important}
/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.kpi .n{font-size:22px;font-weight:800;letter-spacing:-.5px}
.kpi .l{color:var(--mut);font-size:12px;margin-top:2px}
.kpi .d{font-size:11.5px;margin-top:4px;font-weight:600}
h2{font-size:15px;margin:22px 0 8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.srow:last-child{border-bottom:none}
.srow .bar{flex:1;height:7px;background:var(--track);border-radius:5px;overflow:hidden;max-width:120px}
.srow .bar>i{display:block;height:100%;background:var(--green);border-radius:5px}
.srow .v{font-weight:700;min-width:64px;text-align:right}
.srow .nm{flex:1;min-width:0}
.dupe{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:10px;font-size:13.5px}
.dupe b{color:var(--accent)}
/* search */
.searchbar{position:sticky;top:52px;z-index:4;background:var(--bg);padding:4px 0 8px}
.searchbar input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:16px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--mut);font-size:12.5px;margin:8px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.tile .ph{aspect-ratio:3/4.1;background:#0000000d;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile .ph .no{color:var(--mut);font-size:11px;text-align:center;padding:8px}
.tile .m{padding:8px 9px}
.tile .pl{font-weight:650;font-size:12.5px;line-height:1.25}
.tile .st{color:var(--mut);font-size:11px;margin-top:1px;line-height:1.2}
.tile .pr{font-weight:800;margin-top:4px;font-size:14px}
.tile .pr small{font-weight:500;color:var(--mut);font-size:10px}
.badge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--gold);color:#fff;margin-left:5px;vertical-align:middle}
/* detail */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetC{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 40px}
.sheetC .x{position:sticky;top:0;z-index:30;display:block;width:40px;height:40px;margin:-4px -4px 2px auto;font-size:26px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:50%;text-align:center;line-height:38px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.dphotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.dphotos img{width:100%;border-radius:10px;border:1px solid var(--line)}
.dphotos .no{aspect-ratio:3/4;background:var(--card);border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
.dval{font-size:26px;font-weight:800}
.dval small{font-size:12px;color:var(--mut);font-weight:500}
.cvchart{margin:10px 0 4px}
.chartwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.charthd{display:flex;justify-content:space-between;font-size:12px;margin:2px 0}
.cvsvg{width:100%;height:64px;display:block;margin:4px 0}
.chartnote{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--mut)}
.mkt h3{font-size:13.5px;margin:16px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mkt h3 small{color:var(--mut);font-weight:500;font-size:11px;text-align:right}
.mitem{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mitem:last-child{border-bottom:none}
.mitem img{width:40px;height:40px;object-fit:cover;border-radius:6px;background:var(--track);flex:none}
.mitem .ni{width:40px;height:40px;flex:none;border-radius:6px;background:var(--track)}
.mitem .mt{flex:1;min-width:0;font-size:12px;line-height:1.3}
.mitem .mt a{color:var(--ink);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mitem .mt .md{color:var(--mut);font-size:10.5px;margin-top:2px}
.mitem .mp{font-weight:700;font-size:13px;white-space:nowrap}
.mitem.unm{opacity:.48}
.mkt .more{color:var(--blue);font-size:12px;cursor:pointer;padding:9px 0 2px;font-weight:600}
.mkt .none{color:var(--mut);font-size:12px;padding:6px 0}
/* sell tools + pnl */
.pnlbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 2px}
.pnlc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.pnlc .l{color:var(--mut);font-size:11px}
.pnlc .n{font-size:16px;font-weight:800;margin-top:2px}
.rangebox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.rangebox .rl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.rangebox .rv{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
.rangebox .rv b{font-size:20px;letter-spacing:-.5px}
.rangebox .rmid{font-size:12px;color:var(--mut)}
.selltools{margin:14px 0 4px}
.sellhd{font-size:14px;font-weight:700;margin:14px 0 8px}
.selltxt{margin-bottom:10px}
.sthd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:4px}
.sta{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 11px;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;resize:vertical;min-height:96px}
.cpbtn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer}
.cpbtn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.ebaybtn{width:100%;border:none;background:var(--accent);color:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
.ebaybtn.ok{background:var(--green)}
.gear{background:none;border:none;color:var(--mut);font-size:18px;cursor:pointer;padding:2px 8px;line-height:1}
.revbadge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--accent);color:#fff;margin-left:5px;vertical-align:middle}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.qcard img{width:46px;height:46px;object-fit:cover;border-radius:8px;background:var(--track);flex:none}
.qcard .qt{flex:1;min-width:0;font-size:12.5px;line-height:1.3}
.qcard .qt a{color:var(--blue);text-decoration:none;font-size:11px}
.qcard .qm{font-size:11px;color:var(--mut);margin-top:2px}
.qcard .qp{font-weight:700;white-space:nowrap}
.stat-note{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--mut);margin:8px 0}
/* lots */
.lotrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.lotrow .ln{font-weight:700;font-size:15px}
.lotrow .lm{color:var(--mut);font-size:12px;margin-top:2px}
.lotrow .lv{text-align:right;font-weight:800;white-space:nowrap}
.lotrow .lv small{display:block;color:var(--mut);font-size:11px;font-weight:600}
.newlot{width:100%;border:1px dashed var(--line);background:var(--card);color:var(--accent);border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px}
.lottot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.lottot .tc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:center}
.lottot .tc .n{font-size:16px;font-weight:800}
.lottot .tc .l{color:var(--mut);font-size:10.5px;margin-top:1px}
.lotact{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.lotact button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.lotact button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.litem{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.litem img{width:42px;height:42px;object-fit:cover;border-radius:8px;background:var(--track);flex:none}
.litem .lt{flex:1;min-width:0;font-size:12.5px;line-height:1.3;cursor:pointer}
.litem .lt .s{color:var(--mut);font-size:11px}
.litem .lp{font-weight:700;white-space:nowrap;font-size:13px}
.litem .rm{border:none;background:none;color:var(--accent);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.buildbar{position:fixed;left:0;right:0;bottom:56px;background:var(--accent);color:#fff;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;z-index:12;font-size:13px;font-weight:600}
.buildbar button{background:#fff;color:var(--accent);border:none;border-radius:8px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer}
.tile.inlot{outline:3px solid var(--accent);outline-offset:-3px}
.tile .lotchk{position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.tile{position:relative}
.addlotbtn{width:100%;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
.krow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:12px}
.krow .k{color:var(--mut)} .krow .val{text-align:right;font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--chip);border:1px solid var(--line);color:var(--mut)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--mut);font-size:11px;padding:9px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav button.on{color:var(--accent)}
nav button .ic{font-size:18px;line-height:1}
.spin{text-align:center;color:var(--mut);padding:40px;font-size:14px}
.kpi[onclick]{cursor:pointer;transition:transform .05s} .kpi[onclick]:active{transform:scale(.985)}
.srow[onclick]{cursor:pointer}
.segbanner{display:inline-flex;align-items:center;background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 11px;margin-right:9px;font-size:12.5px;color:var(--ink);font-weight:600}
.segbanner b{color:var(--accent);cursor:pointer;margin-left:8px;font-weight:700}
</style>
</head><body>
<header><div><h1>Card Vault</h1></div><div style="display:flex;align-items:center;gap:6px"><div class="as" id="asof"></div><button class="gear" onclick="openSettings()" title="Sale settings">&#9881;</button></div></header>
<div class="wrap">
  <div id="dash"><div class="spin">Loading your collection...</div></div>
  <div id="search" class="hide">
    <div class="searchbar"><input id="q" placeholder="Search player, set, year..." autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <div class="count" id="scount"></div>
    <div class="grid" id="results"></div>
  </div>
  <div id="review" class="hide"></div>
  <div id="lots" class="hide"></div>
</div>
<div id="buildbar" class="hide"></div>
<div id="sheet"></div>
<div id="settings"></div>
<nav>
  <button id="nav-dash" class="on" onclick="show('dash')"><span class="ic">&#9632;</span>Dashboard</button>
  <button id="nav-search" onclick="navSearch()"><span class="ic">&#9906;</span>Search</button>
  <button id="nav-lots" onclick="show('lots');renderLots()"><span class="ic">&#9707;</span>Lots</button>
  <button id="nav-review" onclick="show('review');renderReview()"><span class="ic">&#9998;</span>Review</button>
</nav>
<script>
const SB="https://kcmrmswazprkizbzewpm.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjbXJtc3dhenBya2l6Ynpld3BtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTEzMzAsImV4cCI6MjEwNDEyNzMzMH0.EuB77E8I0b6HzdK8zfDG1qlg-q_k0FUej6pYLyEFiJI";
let CARDS=[], DUPE={}, SEGFILTER=null;
const money=v=>v==null?'--':'$'+Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
const SRCMAP={'ebay-sold':['eBay sold','var(--green)'],'ebay-thin':['eBay (thin)','var(--gold)'],'ebay-broad':['eBay (est)','var(--gold)'],'cardladder-auto':['Card Ladder','var(--blue)'],'cardladder-comp':['Card Ladder','var(--blue)'],'ebay-none':['needs review','var(--mut)'],'sketch-pending':['sketch','var(--mut)'],'ask-tier':['ask tier','var(--mut)']};
function srcLabel(c){const s=SRCMAP[c.value_source];return s?s[0]:(c.value_source||'unpriced');}
function srcColor(c){const s=SRCMAP[c.value_source];return s?s[1]:'var(--mut)';}
function seg(c){const cat=(c.category||''),ref=c.ref||'';
 if(c.sport)return c.sport;
 if(cat.includes('Project 70')||ref.startsWith('P70'))return 'Topps Project 70';
 if(cat.startsWith('SW')||/^(SW|SWA|SWSK|SWPP|SPSK)/.test(ref)){if(cat.includes('Auto'))return 'Star Wars - autos';if(cat.includes('Sketch'))return 'Star Wars - sketch 1/1';return 'Star Wars - relic/parallel/art';}
 if(cat.includes('Entertainment'))return 'Entertainment';
 if(cat.includes('Sealed'))return 'Sealed wax';
 if(cat.includes('Pokemon'))return 'Pokemon';
 if(/Sports|Basketball|Graded|Raw Sports/.test(cat))return 'Sports (other)';
 return 'Other';}
function primary(c){if(!c.photos||!c.photos.length)return null;const f=c.photos.find(p=>p.is_primary)||c.photos.find(p=>p.side==='front')||c.photos[0];return f?f.url:null;}
async function fetchJSON(u,tries){
 for(let i=0;i<(tries||3);i++){
   try{const r=await fetch(u,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
     if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}
   catch(e){if(i===(tries||3)-1)throw e;await new Promise(s=>setTimeout(s,600*(i+1)));}
 }
}
async function load(){
 try{
  CARDS=await fetchJSON(SB+"/rest/v1/cards?select=*,photos(url,side,is_primary)&order=current_value.desc.nullslast&limit=5000");
  DUPE={};CARDS.forEach(c=>{(DUPE[c.dupe_key]=DUPE[c.dupe_key]||[]).push(c);});
  renderDash(); buildChips(); loadLots();
  document.getElementById('asof').textContent='as of '+new Date().toLocaleDateString();
 }catch(e){
  document.getElementById('dash').innerHTML='<div class="spin">Could not load ('+e.message+'). Pull to refresh.</div>';
 }
}
function renderDash(){
 const own=CARDS.filter(c=>c.status!=='sold');
 const val=own.reduce((s,c)=>s+(+c.current_value||0),0);
 const cost=own.reduce((s,c)=>s+(+c.cost_basis||0),0);
 const valued=own.filter(c=>c.current_value!=null).length;
 const withPhoto=own.filter(c=>c.photos&&c.photos.length).length;
 const dupeGroups=Object.values(DUPE).filter(g=>g.filter(c=>c.status!=='sold').length>1).length;
 const segs={};own.forEach(c=>{const s=seg(c);(segs[s]=segs[s]||{n:0,v:0}); segs[s].n++; segs[s].v+=(+c.current_value||0);});
 const segArr=Object.entries(segs).sort((a,b)=>b[1].v-a[1].v);const maxV=Math.max(...segArr.map(s=>s[1].v),1);
 const gain=val-cost;
 let h=`<div class="kpis">
  <div class="kpi" onclick="openAll('value')"><div class="n">${money(val)}</div><div class="l">Collection value &rsaquo;</div><div class="d" style="color:var(--green)">across ${valued.toLocaleString()} priced</div></div>
  <div class="kpi" onclick="openAll('all')"><div class="n">${own.length.toLocaleString()}</div><div class="l">Cards owned &rsaquo;</div><div class="d" style="color:var(--mut)">${withPhoto} with photos</div></div>
  <div class="kpi"><div class="n">${money(cost)}</div><div class="l">Cost basis</div><div class="d" style="color:${gain>=0?'var(--green)':'var(--accent)'}">${gain>=0?'+':''}${money(gain)} vs cost</div></div>
  <div class="kpi" onclick="openDupes()"><div class="n">${dupeGroups}</div><div class="l">Duplicate groups &rsaquo;</div><div class="d" style="color:var(--mut)">cards you own 2+ of</div></div>
 </div>`;
 h+=`<div class="dupe">Value shown is your latest comped/ask number per card. Only your Maine lot sits on live sold comps so far; tap Search to dig in. <b>${dupeGroups} groups</b> have duplicates worth reviewing.</div>`;
 h+=`<h2>By segment</h2><div class="panel">`;
 segArr.forEach(([n,d])=>{h+=`<div class="srow" data-seg="${n}" onclick="openSeg(this.dataset.seg)"><span class="nm">${n} &rsaquo;<br><span style="color:var(--mut);font-size:11px">${d.n} cards</span></span><span class="bar"><i style="width:${d.v/maxV*100}%"></i></span><span class="v">${d.v?money(d.v):'--'}</span></div>`;});
 h+=`</div>`;
 h+=`<h2>Top cards by value</h2><div class="panel">`;
 own.filter(c=>c.current_value!=null).sort((a,b)=>b.current_value-a.current_value).slice(0,8).forEach(c=>{
   h+=`<div class="srow" onclick='openCard("${c.id}")' style="cursor:pointer"><span class="nm">${c.player||c.ref}<br><span style="color:var(--mut);font-size:11px">${c.set_name||''}</span></span><span class="v">${money(c.current_value)}</span></div>`;});
 h+=`</div>`;
 document.getElementById('dash').innerHTML=h;
}
let FILT='all';
function buildChips(){
 const c=['all','own','graded','has photo','rookies','autos','relics','duplicates'];
 document.getElementById('chips').innerHTML=c.map(x=>`<div class="chip ${x==='all'?'on':''}" data-f="${x}" onclick="setFilt('${x}',this)">${x}</div>`).join('');
}
function setFilt(f,el){FILT=f;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');runSearch();}
function runSearch(){
 const q=document.getElementById('q').value.toLowerCase().trim();
 let list=CARDS.filter(c=>c.status!=='sold');
 if(FILT==='graded')list=list.filter(c=>c.grade&&!/raw/i.test(c.grade));
 else if(FILT==='has photo')list=list.filter(c=>c.photos&&c.photos.length);
 else if(FILT==='rookies')list=list.filter(c=>c.is_rookie);
 else if(FILT==='autos')list=list.filter(c=>c.is_auto);
 else if(FILT==='relics')list=list.filter(c=>c.is_relic);

function cardLine(c){

function cleanGrade(g){
 if(!g||/^raw$/i.test(g.trim()))return null;
 const m=String(g).match(/\b(PSA|BGS|BVG|SGC|CGC|CSG|BAS|HGA)\s*\.?\s*(10|[1-9](?:\.5)?)\b/i);
 if(m)return m[1].toUpperCase()+' '+m[2];
 return /raw|ungraded/i.test(g)?null:g.split(/[-(]/)[0].trim();
}
function askPrice(c,stats){

 L.push(price?('$'+price.toLocaleString()):'$[price]');

 if(t.ship)L.push(t.ship);

}

async function loadMarket(id){

function pctile(sorted,p){if(!sorted.length)return null;const i=(sorted.length-1)*p;const lo=Math.floor(i),hi=Math.ceil(i);return sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);}
function soldStats(sold){
 const v=sold.filter(r=>r.matched&&r.price).map(r=>+r.price).sort((a,b)=>a-b);
 if(!v.length)return null;
 return {n:v.length,low:Math.round(pctile(v,0.25)),med:Math.round(pctile(v,0.5)),high:Math.round(pctile(v,0.90))};
}

 const name=prompt('Name this lot (e.g. "Show 9/6")');
 if(name===null)return;
 const res=await lotOp({op:'create_lot',name:name||'New lot'});
 if(res&&res.ok){await loadLots();renderLots();openLot(res.id);}
 else alert('Could not create lot');
}
function openLot(id){
 OPENLOT=id; const l=LOTS.find(x=>x.id===id); if(!l){renderLots();return;}
 const set=LOTMEM[id]||new Set();
 const cards=CARDS.filter(c=>set.has(c.id)).sort((a,b)=>(b.current_value||0)-(a.current_value||0));
 const t=lotTotals(id); const pnl=t.cost?t.val-t.cost:null;
 const el=document.getElementById('lots');
 let h=`<div style="display:flex;align-items:center;gap:8px;margin:16px 0 4px"><button class="cpbtn" onclick="show('lots');renderLots()">&lsaquo; Lots</button><h2 style="margin:0;flex:1">${l.name||'Lot'}</h2></div>`;
 h+=`<div class="lottot"><div class="tc"><div class="n">${t.n}</div><div class="l">cards</div></div><div class="tc"><div class="n">${money(t.val)}</div><div class="l">value</div></div><div class="tc"><div class="n" style="color:${pnl==null?'var(--ink)':(pnl>=0?'var(--green)':'var(--accent)')}">${t.cost?money(t.cost):'--'}</div><div class="l">cost</div></div></div>`;
 h+=`<div class="lotact"><button class="primary" onclick="startBuild('${id}')">+ Add cards</button><button onclick="copyLotPost('${id}')">Copy lot post</button><button onclick="renameLot('${id}')">Rename</button><button onclick="deleteLot('${id}')">Delete</button></div>`;
 if(!cards.length) h+='<div class="stat-note">No cards yet. Tap “+ Add cards” and tap cards to add them.</div>';
 cards.forEach(c=>{const u=primary(c);
   h+=`<div class="litem"><img loading="lazy" src="${u||''}" onerror="this.style.visibility='hidden'"><div class="lt" onclick='openCard("${c.id}")'>${c.player||c.ref}<div class="s">${c.set_name||''} ${c.card_number?'#'+c.card_number:''} &middot; <span style="color:${srcColor(c)}">${money(c.current_value)}</span></div></div><button class="rm" title="remove" onclick="removeFromLot('${id}','${c.id}')">&times;</button></div>`;
 });
 el.innerHTML=h; window.scrollTo(0,0);
}
async function renameLot(id){const l=LOTS.find(x=>x.id===id);const name=prompt('Rename lot',l?l.name:'');if(name===null)return;await lotOp({op:'rename_lot',lot_id:id,name});await loadLots();openLot(id);}
async function deleteLot(id){if(!confirm('Delete this lot? (cards stay in your inventory)'))return;await lotOp({op:'delete_lot',lot_id:id});await loadLots();show('lots');renderLots();}
async function removeFromLot(lotId,cardId){(LOTMEM[lotId]||new Set()).delete(cardId);await lotOp({op:'remove_item',lot_id:lotId,card_id:cardId});openLot(lotId);}
async function addToLotId(lotId,cardId){(LOTMEM[lotId]=LOTMEM[lotId]||new Set()).add(cardId);await lotOp({op:'add_item',lot_id:lotId,card_id:cardId});}
/* builder mode: browse Search, tap toggles membership */
function startBuild(id){BUILDLOT=id;show('search');navSearchKeep();updateBuildBar();}
function navSearchKeep(){SEGFILTER=null;FILT='all';setChip('all');show('search');runSearch();}
function updateBuildBar(){
 const bar=document.getElementById('buildbar');
 if(!BUILDLOT){bar.classList.add('hide');return;}
 const l=LOTS.find(x=>x.id===BUILDLOT);const t=lotTotals(BUILDLOT);
 bar.className='buildbar';
 bar.innerHTML=`<span>Adding to “${l?l.name:'lot'}” &middot; ${t.n} card${t.n===1?'':'s'} &middot; ${money(t.val)}</span><button onclick="finishBuild()">Done</button>`;
}
function finishBuild(){const id=BUILDLOT;BUILDLOT=null;document.getElementById('buildbar').classList.add('hide');show('lots');if(id)openLot(id);else renderLots();}
async function toggleLotCard(cardId){
 if(!BUILDLOT)return;
 const set=LOTMEM[BUILDLOT]=LOTMEM[BUILDLOT]||new Set();
 if(set.has(cardId)){set.delete(cardId);await lotOp({op:'remove_item',lot_id:BUILDLOT,card_id:cardId});}
 else{set.add(cardId);await lotOp({op:'add_item',lot_id:BUILDLOT,card_id:cardId});}
 runSearch();updateBuildBar();
}
async function addToLotMenu(cardId){
 if(!LOTS.length) await loadLots();
 const box=document.getElementById('settings');
 const rows=LOTS.map(l=>{const inl=(LOTMEM[l.id]||new Set()).has(cardId);return `<div class="lotrow" onclick="toggleCardInLot('${l.id}','${cardId}',this)"><div><div class="ln">${l.name||'Lot'}</div><div class="lm">${lotTotals(l.id).n} cards</div></div><div class="lv" style="color:${inl?'var(--green)':'var(--mut)'}">${inl?'&#10003; in lot':'add'}</div></div>`;}).join('');
 box.innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSettings()"><div class="sheetC" style="max-width:480px">
   <span class="x" onclick="closeSettings()">&times;</span>
   <h2 style="margin:2px 0 10px;font-size:18px">Add to a lot</h2>
   ${rows||'<div class="stat-note">No lots yet.</div>'}
   <button class="newlot" style="margin-top:10px" onclick="newLotFor('${cardId}')">+ New lot</button>
 </div></div>`;
}
async function toggleCardInLot(lotId,cardId,elrow){
 const inl=(LOTMEM[lotId]||new Set()).has(cardId);
 if(inl){await removeFromLotSilent(lotId,cardId);}else{await addToLotId(lotId,cardId);}
 addToLotMenu(cardId);
}
async function removeFromLotSilent(lotId,cardId){(LOTMEM[lotId]||new Set()).delete(cardId);await lotOp({op:'remove_item',lot_id:lotId,card_id:cardId});}
async function newLotFor(cardId){const name=prompt('Name this lot (e.g. "Show 9/6")');if(name===null)return;const res=await lotOp({op:'create_lot',name:name||'New lot'});if(res&&res.ok){await loadLots();await addToLotId(res.id,cardId);addToLotMenu(cardId);}}
function copyLotPost(id){
 const l=LOTS.find(x=>x.id===id);const set=LOTMEM[id]||new Set();
 const cards=CARDS.filter(c=>set.has(c.id)).sort((a,b)=>(b.current_value||0)-(a.current_value||0));
 const t=lotTotals(id);const tm=terms();
 let L=[(l&&l.name?l.name:'Card lot')+' — '+cards.length+' cards'];
 L.push('');
 cards.forEach((c,i)=>{L.push((i+1)+'. '+cardLine(c)+(c.current_value?(' — $'+Math.round(c.current_value)):''));});
 L.push('');
 L.push('Value if bought separately: ~$'+Math.round(t.val).toLocaleString());
 L.push('Bundle price: $'+(l&&l.suggested_price?l.suggested_price:'[your price]'));
 L.push('');
 if(tm.pay)L.push(tm.pay); if(tm.ship)L.push(tm.ship); if(tm.claim)L.push(tm.claim);
 if(tm.closer)L.push('','— '+tm.closer);
 const txt=L.join('\n');
 const done=()=>alert('Lot post copied to clipboard');
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,done);else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done();}
}
function setChip(f){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===f));}
function navSearch(){SEGFILTER=null;FILT='all';setChip('all');show('search');runSearch();}
function openSeg(name){SEGFILTER=name;FILT='all';setChip('all');show('search');runSearch();}
function openAll(mode){SEGFILTER=null;FILT='all';setChip('all');show('search');runSearch();}
function openDupes(){SEGFILTER=null;FILT='duplicates';setChip('duplicates');show('search');runSearch();}
function clearSeg(){SEGFILTER=null;runSearch();}
document.getElementById('q').addEventListener('input',runSearch);
load();
</script>
</body></html>
